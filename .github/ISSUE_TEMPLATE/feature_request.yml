name: Feature request
description: 提出一个功能建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的实际问题
      description: 先讲问题，再讲方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的方案
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
