name: Bug report
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴 API Key、会话内容或任何凭据。会话 ID 请替换为合成值。
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      placeholder: 例如 0.1.6
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开一个长会话 2. 点顶栏徽标 3. ……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望与实际
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 截图（用构造数据）或控制台报错原文
    validations:
      required: false
